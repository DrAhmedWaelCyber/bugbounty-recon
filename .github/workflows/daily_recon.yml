# =============================================================
# daily_recon.yml — BugBounty-Recon Daily Reconnaissance
# =============================================================
# Developer : Ahmed Wael
# Purpose   : Run every day at 06:00 UTC, processing exactly 9 part files
#             per day.  The 63-part weekly rotation is derived automatically
#             from the current ISO day-of-week so that:
#
#               Mon → parts  1–9
#               Tue → parts 10–18
#               Wed → parts 19–27
#               Thu → parts 28–36
#               Fri → parts 37–45
#               Sat → parts 46–54
#               Sun → parts 55–63
#
#             Each part is processed SEQUENTIALLY with a 3-minute cooldown
#             between parts to prevent timeout bottlenecks and avoid hitting
#             upstream rate limits.
#
#             Each run:
#               1. Derives which 9 parts belong to today.
#               2. Runs main.py which processes each part in order:
#                    subfinder → httpx → diff → triage
#                    → HTML email report → baseline update → 3-min cooldown
#               3. Commits updated baseline_subs.txt back to the repo.
#               4. Uploads all HTML report files as a 30-day audit artifact.
# =============================================================

name: "Daily — Reconnaissance"

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      parts:
        description: >
          Comma-separated part numbers to process (e.g. 1,2,3,4,5,6,7,8,9).
          Leave blank to auto-derive from today's ISO day-of-week.
        required: false
        default: ""

jobs:
  recon:
    name: "Daily Recon — ${{ github.event_name == 'workflow_dispatch' && inputs.parts != '' && format('Parts {0}', inputs.parts) || 'Auto (9 parts)' }}"
    runs-on: ubuntu-latest
    # 9 parts × ~30 min each + 8 × 3 min cooldowns ≈ 5 hours worst case
    timeout-minutes: 360

    permissions:
      contents: write    # Required to push updated baseline_subs.txt

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Resolve which parts to run ─────────────────────────────────────────
      - name: Resolve PARTS for this run
        id: resolve_parts
        run: |
          if [ -n "${{ inputs.parts }}" ]; then
            PARTS="${{ inputs.parts }}"
            echo "Using manually specified parts: $PARTS"
          else
            # ISO day-of-week: 1=Mon … 7=Sun
            # Mon → 1-9 | Tue → 10-18 | Wed → 19-27 | Thu → 28-36
            # Fri → 37-45 | Sat → 46-54 | Sun → 55-63
            DOW=$(date -u +"%u")
            START=$(( (DOW - 1) * 9 + 1 ))
            END=$(( START + 8 ))
            PARTS=$(seq -s ',' $START $END)
            echo "Day-of-week=$DOW → derived parts: $PARTS"
          fi

          echo "PARTS=$PARTS" >> $GITHUB_ENV
          echo "parts=$PARTS" >> $GITHUB_OUTPUT

      # ── 3. Ensure part files exist (emergency split if missing) ──────────────
      - name: Check part files / run emergency split if needed
        run: |
          if [ ! -d "parts" ] || [ "$(ls parts/part_*.txt 2>/dev/null | wc -l)" -lt 63 ]; then
            echo "⚠️  Part files missing — running split_wildcards.py now …"
            pip install --upgrade pip requests -q
            python split_wildcards.py
          else
            echo "✅ All 63 part files present."
          fi

      # ── 4. Set up Python ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 5. Set up Go ──────────────────────────────────────────────────────────
      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ── 6. Install recon tools ────────────────────────────────────────────────
      - name: Install subfinder
        run: go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest

      - name: Install httpx
        run: go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest

      - name: Verify tool installations
        run: |
          echo "--- subfinder ---"
          subfinder -version
          echo "--- httpx ---"
          httpx -version

      # ── 7. Run sequential reconnaissance pipeline ─────────────────────────────
      - name: "Run main.py — Parts ${{ steps.resolve_parts.outputs.parts }}"
        env:
          PARTS:           ${{ env.PARTS }}
          SMTP_EMAIL:      ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
        run: python main.py

      # ── 8. Commit updated baseline ────────────────────────────────────────────
      - name: Commit and push updated baseline_subs.txt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add baseline_subs.txt

          if git diff --cached --quiet; then
            echo "baseline_subs.txt is unchanged — nothing to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore: update baseline_subs.txt [Parts ${{ env.PARTS }}] [${DATE}] [skip ci]"
            git push
            echo "✅ Baseline committed and pushed."
          fi

      # ── 9. Upload HTML reports as artifacts (30-day audit trail) ─────────────
      - name: Upload HTML report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "recon-reports-${{ env.PARTS }}-run${{ github.run_number }}"
          path: "last_report_part*.html"
          if-no-files-found: ignore
          retention-days: 30
